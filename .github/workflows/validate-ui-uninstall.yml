name: Validate Madi UI Voice and Uninstall Fixes
on:
  push:
    branches: [fix/uninstall-voice-layout]
  workflow_dispatch:
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: \${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate branding
        shell: pwsh
        run: |
          python -m pip install pillow
          python tools/generate_assets.py
      - name: Build Madi AI and setup
        shell: pwsh
        run: |
          dotnet publish MadiAI/MadiAI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
          Compress-Archive -Path publish\* -DestinationPath app-package.zip -Force
          dotnet publish SetupHost/SetupHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o setup
      - name: Run isolated app and setup UI checks
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'madi-validation'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          Copy-Item publish/MadiAI.exe $isolated
          Copy-Item setup/Madi-AI-Setup.exe $isolated
          $checks = @(
            @{ File = 'MadiAI.exe'; Args = '--smoke-ui'; Log = 'madi-app-smoke.log'; Expected = 'loaded: True' },
            @{ File = 'Madi-AI-Setup.exe'; Args = '--smoke-ui'; Log = 'madi-setup-smoke.log'; Expected = 'mode: install' },
            @{ File = 'Madi-AI-Setup.exe'; Args = '--smoke-ui --smoke-uninstall-ui'; Log = 'madi-setup-smoke.log'; Expected = 'mode: uninstall' }
          )
          foreach ($check in $checks) {
            $log = Join-Path $env:TEMP $check.Log
            Remove-Item $log -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath (Join-Path $isolated $check.File) -ArgumentList $check.Args -PassThru
            if (-not $p.WaitForExit(45000)) { $p.Kill(); throw "Timeout: $($check.File) $($check.Args)" }
            Write-Host "$($check.File) $($check.Args): exit $($p.ExitCode)"
            if (Test-Path $log) { Get-Content $log }
            if ($p.ExitCode -ne 0) { throw "Crash: $($check.File) exit $($p.ExitCode)" }
            if (-not (Test-Path $log)) { throw "Missing trace: $($check.Log)" }
            if (-not (Select-String -Path $log -Pattern $check.Expected -Quiet)) { throw "Missing $($check.Expected)" }
          }
          Copy-Item setup/Madi-AI-Setup.exe (Join-Path $isolated 'Uninstall Madi AI.exe')
          Remove-Item (Join-Path $env:TEMP 'madi-setup-smoke.log') -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Join-Path $isolated 'Uninstall Madi AI.exe') -ArgumentList '--smoke-ui' -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw 'Uninstall shortcut startup timed out' }
          if ($p.ExitCode -ne 0) { throw 'Uninstaller failed to start' }
          if (-not (Select-String -Path (Join-Path $env:TEMP 'madi-setup-smoke.log') -Pattern 'mode: uninstall' -Quiet)) { throw 'Uninstaller defaulted to install mode' }
      - name: Check registration logic
        shell: pwsh
        run: |
          $source = Get-Content SetupHost/Program.cs -Raw
          if ($source -notmatch 'UninstallString.*/uninstall') { throw 'Control Panel uninstall argument is missing' }
          if ($source -notmatch 'launchedAsUninstaller') { throw 'Uninstaller name detection missing' }
