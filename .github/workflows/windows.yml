name: Build Madi AI Windows
on:
  push:
    branches: [main, 'fix/voice-chat-routing-20261105']
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate HD branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_assets.py
      - name: Publish native Madi AI
        shell: pwsh
        run: dotnet publish MadiAI/MadiAI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Bundle offline multilingual speech model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/models -Force | Out-Null
          Invoke-WebRequest -Uri 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin' -OutFile publish/models/ggml-tiny.bin -MaximumRedirection 10
          if ((Get-Item publish/models/ggml-tiny.bin).Length -lt 20000000) { throw 'Offline voice model is incomplete' }
      - name: Verify offline speech engine
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'madi-voice-smoke.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path publish/MadiAI.exe).Path -ArgumentList '--smoke-voice' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Voice startup timed out' }
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Offline voice engine failed: $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'initialized successfully' -Quiet)) { throw 'Voice engine did not initialize' }
      - name: Bundle app payload
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath app-package.zip -Force
      - name: Publish dark-themed installer and uninstaller
        shell: pwsh
        run: dotnet publish SetupHost/SetupHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o setup
      - name: Publish alternate framework-dependent installer for compatibility diagnosis
        shell: pwsh
        run: |
          dotnet publish SetupHost/SetupHost.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:UseAppHost=true -o setup-compatible
          if (-not (Test-Path 'setup-compatible/Madi-AI-Setup.exe')) { throw 'Compatible installer executable missing' }
          Compress-Archive -Path setup-compatible/* -DestinationPath Madi-AI-Setup-Compatible.zip -Force
      - name: Verify alternate installer launches
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'madi-setup-smoke.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path setup-compatible/Madi-AI-Setup.exe).Path -ArgumentList '--smoke-ui' -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw 'Alternate installer startup timed out' }
          if ($p.ExitCode -ne 0) { throw "Alternate installer failed: $($p.ExitCode)" }
          if (-not (Test-Path $log)) { throw 'Alternate installer startup trace missing' }
          if (-not (Select-String -Path $log -Pattern 'loaded: True' -Quiet)) { throw 'Alternate installer window did not load' }
      - name: Verify Windows x64 PE installer and checksum
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'setup/Madi-AI-Setup.exe').Path
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 1000000) { throw 'Installer unexpectedly small' }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Installer missing MZ header' }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 64 -or $peOffset + 6 -ge $bytes.Length) { throw 'Invalid PE header offset' }
          if ([Text.Encoding]::ASCII.GetString($bytes, $peOffset, 4) -ne "PE`0`0") { throw 'Invalid PE signature' }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("Installer architecture mismatch: 0x{0:X4}" -f $machine) }
          Write-Host "Verified x64 Windows PE installer: $($bytes.Length) bytes"
          Get-FileHash $exe -Algorithm SHA256 | Format-List
      - name: Verify standalone EXE launches without sidecar DLLs
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'madi-standalone-test'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          Copy-Item setup/Madi-AI-Setup.exe $isolated
          $exe = Join-Path $isolated 'Madi-AI-Setup.exe'
          $log = Join-Path $env:TEMP 'madi-setup-smoke.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-ui' -PassThru
          if (-not $p.WaitForExit(45000)) {
            $p.Kill()
            throw 'Standalone installer failed to start within 45 seconds'
          }
          Write-Host "Standalone installer exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Standalone installer failed: $($p.ExitCode)" }
          if (-not (Test-Path $log)) { throw 'Installer window did not start' }
          if (-not (Select-String -Path $log -Pattern 'loaded: True' -Quiet)) { throw 'Installer window did not load' }
      - name: Verify actual install and uninstall
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'madi-install-integration.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path setup/Madi-AI-Setup.exe).Path -ArgumentList '--smoke-install-uninstall' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Install/uninstall timed out' }
          if ($p.ExitCode -ne 0) { throw "Install/uninstall failed: $($p.ExitCode)" }
          if (-not (Test-Path $log)) { throw 'Install/uninstall success trace missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Madi-AI-Native-Dark-Installer
          path: setup/Madi-AI-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Madi-AI-Installer-Compatible-Diagnostic
          path: Madi-AI-Setup-Compatible.zip
          if-no-files-found: error
      - name: Publish direct-download EXE release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.5-alpha
          name: Madi AI v0.2.5 Alpha - WPF installer thread fix and improved reference UI
          prerelease: true
          files: setup/Madi-AI-Setup.exe
          fail_on_unmatched_files: true
