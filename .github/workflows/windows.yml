name: Build Madi AI Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate HD branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_assets.py
      - name: Publish native Madi AI
        shell: pwsh
        run: dotnet publish MadiAI/MadiAI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" installer\madi.nsi'
      - uses: actions/upload-artifact@v4
        with:
          name: Madi-AI-Windows-Installer
          path: installer/Madi-AI-Setup.exe
          if-no-files-found: error
