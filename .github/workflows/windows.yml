name: Build Madi AI Windows
on:
  push:
    branches: [main, fix/local-ai-detection-memory-voice-ui]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Generate HD branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_assets.py
      - name: Publish native Madi AI
        shell: pwsh
        run: dotnet publish MadiAI/MadiAI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Verify MT5 bridge parser and stale-status protection
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path publish/MadiAI.exe).Path -ArgumentList '--smoke-mt5-bridge' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "MT5 bridge parser smoke test failed: $($p.ExitCode)" }
      - name: Bundle MT5 local bridge source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/MT5 -Force | Out-Null
          Copy-Item MT5/MadiAI_Bridge.mq5 publish/MT5/MadiAI_Bridge.mq5
      - name: Verify saved desktop routines and command safety
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path publish/MadiAI.exe).Path -ArgumentList '--smoke-routines' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Local routines smoke test failed: $($p.ExitCode)" }
      - name: Verify local memory persistence and privacy
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path publish/MadiAI.exe).Path -ArgumentList '--smoke-memory' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Local memory smoke test failed: $($p.ExitCode)" }
      - name: Bundle offline multilingual speech model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path publish/models -Force | Out-Null
          Invoke-WebRequest -Uri 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin' -OutFile publish/models/ggml-tiny.bin -MaximumRedirection 10
          if ((Get-Item publish/models/ggml-tiny.bin).Length -lt 20000000) { throw 'Offline voice model is incomplete' }
          # The tiny model is kept as a low-latency fallback. The base multilingual
          # model is preferred for Urdu, Hindi, and code-switched English speech.
          Invoke-WebRequest -Uri 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin' -OutFile publish/models/ggml-base.bin -MaximumRedirection 10
          if ((Get-Item publish/models/ggml-base.bin).Length -lt 100000000) { throw 'Multilingual base speech model is incomplete' }
      - name: Bundle free offline Piper neural English voice
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'piper_windows_amd64.zip'
          $unpack = Join-Path $env:RUNNER_TEMP 'piper_unpack'
          Invoke-WebRequest -Uri 'https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_windows_amd64.zip' -OutFile $archive -MaximumRedirection 10
          Expand-Archive -Path $archive -DestinationPath $unpack -Force
          $binary = Get-ChildItem -Path $unpack -Filter 'piper.exe' -File -Recurse | Select-Object -First 1
          if (-not $binary) { throw 'Piper Windows binary was not found in the downloaded archive' }
          New-Item -ItemType Directory -Path publish/piper/voices -Force | Out-Null
          Copy-Item -Path (Join-Path $binary.Directory.FullName '*') -Destination publish/piper -Recurse -Force
          $voices = @(
            @{ name='en_US-ljspeech-medium'; root='en/en_US/ljspeech/medium' }
          )
          foreach ($voice in $voices) {
            $base = "https://huggingface.co/rhasspy/piper-voices/resolve/main/$($voice.root)"
            $model = "publish/piper/voices/$($voice.name).onnx"
            Invoke-WebRequest -Uri "$base/$($voice.name).onnx" -OutFile $model -MaximumRedirection 10
            Invoke-WebRequest -Uri "$base/$($voice.name).onnx.json" -OutFile "$model.json" -MaximumRedirection 10
            Invoke-WebRequest -Uri "$base/MODEL_CARD" -OutFile "publish/piper/voices/$($voice.name)-MODEL_CARD" -MaximumRedirection 10
            if ((Get-Item $model).Length -lt 20000000) { throw "Piper voice $($voice.name) is incomplete" }
          }
          Copy-Item THIRD_PARTY_VOICES.md publish/THIRD_PARTY_VOICES.md
      - name: Verify bundled offline neural English synthesis
        shell: pwsh
        run: |
          $exe = (Resolve-Path publish/piper/piper.exe).Path
          $english = (Resolve-Path publish/piper/voices/en_US-ljspeech-medium.onnx).Path
          $wav = Join-Path $env:RUNNER_TEMP 'madi-neural-en.wav'
          'Hello, I am Madi, your offline assistant.' | & $exe --model $english --output_file $wav
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $wav) -or (Get-Item $wav).Length -lt 3000) { throw 'English Piper synthesis failed' }
      - name: Bundle offline Hindi and Urdu speech models
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Path publish/sherpa/voices -Force | Out-Null
          $models = @('vits-piper-hi_IN-priyamvada-medium', 'vits-piper-ur_PK-fasih-medium')
          foreach ($name in $models) {
            $archive = Join-Path $env:RUNNER_TEMP "$name.tar.bz2"
            Invoke-WebRequest -Uri "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$name.tar.bz2" -OutFile $archive -MaximumRedirection 10
            tar -xjf $archive -C publish/sherpa/voices
            if ($LASTEXITCODE -ne 0) { throw "Cannot extract voice model $name" }
            $dir = "publish/sherpa/voices/$name"
            if (-not (Test-Path "$dir/tokens.txt") -or -not (Test-Path "$dir/espeak-ng-data")) {
              throw "Voice model $name is incomplete"
            }
          }
      - name: Verify real offline Hindi and Urdu synthesis
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'madi-indic-errors.log'
          $out = Join-Path $env:RUNNER_TEMP 'madi-indic-output.log'
          $p = Start-Process -FilePath (Resolve-Path publish/MadiAI.exe).Path -ArgumentList '--smoke-indic-voice' -PassThru -Wait -RedirectStandardError $log -RedirectStandardOutput $out
          if (Test-Path $log) { Get-Content $log | Select-Object -Last 100 }
          if (Test-Path $out) { Get-Content $out | Select-Object -Last 100 }
          if ($p.ExitCode -ne 0) { throw "Unicode Hindi/Urdu speech pipeline failed: $($p.ExitCode)" }
      - name: Verify offline speech engine
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'madi-voice-smoke.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path publish/MadiAI.exe).Path -ArgumentList '--smoke-voice' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'Voice startup timed out' }
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Offline voice engine failed: $($p.ExitCode)" }
          if (-not (Select-String -Path $log -Pattern 'initialized successfully' -Quiet)) { throw 'Voice engine did not initialize' }
      - name: Verify actual Madi AI dashboard loads
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'madi-app-smoke.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path publish/MadiAI.exe).Path -ArgumentList '--smoke-ui' -PassThru
          if (-not $p.WaitForExit(45000)) { $p.Kill(); throw 'Madi AI dashboard startup timed out' }
          if ($p.ExitCode -ne 0) { throw "Madi AI dashboard failed: $($p.ExitCode)" }
          if (-not (Test-Path $log)) { throw 'Dashboard smoke log missing' }
          Get-Content $log
          if (-not (Select-String -Path $log -Pattern 'loaded: True' -Quiet)) { throw 'Dashboard did not load' }
          $image = Join-Path $env:TEMP 'madi-actual-ui.png'
          if (-not (Test-Path $image)) { throw 'Actual WPF dashboard screenshot was not captured' }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item $image artifacts/Madi-AI-Actual-UI.png
      - uses: actions/upload-artifact@v4
        with:
          name: Madi-AI-Actual-Windows-UI
          path: artifacts/Madi-AI-Actual-UI.png
          if-no-files-found: error
      - name: Bundle app payload
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath app-package.zip -Force
      - name: Publish dark-themed installer and uninstaller
        shell: pwsh
        run: dotnet publish SetupHost/SetupHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o setup
      - name: Verify standalone EXE launches without sidecar DLLs
        shell: pwsh
        run: |
          $isolated = Join-Path $env:RUNNER_TEMP 'madi-standalone-test'
          New-Item -ItemType Directory -Path $isolated -Force | Out-Null
          Copy-Item setup/Madi-AI-Setup.exe $isolated
          $exe = Join-Path $isolated 'Madi-AI-Setup.exe'
          $log = Join-Path $env:TEMP 'madi-setup-smoke.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath $exe -ArgumentList '--smoke-ui' -PassThru
          if (-not $p.WaitForExit(45000)) {
            $p.Kill()
            throw 'Standalone installer failed to start within 45 seconds'
          }
          Write-Host "Standalone installer exit code: $($p.ExitCode)"
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { throw "Standalone installer failed: $($p.ExitCode)" }
          if (-not (Test-Path $log)) { throw 'Installer window did not start' }
          if (-not (Select-String -Path $log -Pattern 'loaded: True' -Quiet)) { throw 'Installer window did not load' }
      - name: Verify actual install and uninstall
        shell: pwsh
        run: |
          $log = Join-Path $env:TEMP 'madi-install-integration.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Resolve-Path setup/Madi-AI-Setup.exe).Path -ArgumentList '--smoke-install-uninstall' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Install/uninstall timed out' }
          if ($p.ExitCode -ne 0) { throw "Install/uninstall failed: $($p.ExitCode)" }
          if (-not (Test-Path $log)) { throw 'Install/uninstall success trace missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Madi-AI-Native-Dark-Installer
          path: setup/Madi-AI-Setup.exe
          if-no-files-found: error
      - name: Publish direct-download EXE release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.3.0-development-preview
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: Madi AI development preview - reference dashboard and low-latency local command routing (not final)
          prerelease: true
          files: |
            setup/Madi-AI-Setup.exe
            artifacts/Madi-AI-Actual-UI.png
          fail_on_unmatched_files: true
